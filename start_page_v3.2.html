  /* optional CRT scanlines (config fx off disables) */
  html.fx body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(rgba(0,0,0,.14) 0 1px, transparent 1px 3px);
  }
  #term {
    max-width: 900px; margin: 0 auto; padding: 16px 20px; border-radius: 6px;
    background: rgba(5,8,7,.55); text-shadow: 0 1px 2px rgba(0,0,0,.85);
  }
  .line { white-space: pre-wrap; word-break: break-word; }
  .dim { color: var(--dim); }
  .err { color: var(--err); }
  .prompt { color: var(--fg); white-space: nowrap; }
  .typed { color: var(--accent); }
  .row { display: flex; gap: 8px; }
  #input {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
    color: var(--accent); font: inherit; padding: 0;
    caret-color: var(--accent); caret-shape: block;
  }
  #suggestions { max-width: 650px; }
  .suggestion { padding: 2px 8px; color: var(--dim); cursor: pointer; white-space: pre-wrap; }
  .suggestion strong { color: var(--accent); font-weight: normal; }
  .suggestion.active { background: color-mix(in srgb, var(--accent) 25%, transparent); color: #f0eaff; }
  .suggestion .hint { opacity: .75; }
  #chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  #chips button {
    font: inherit; color: var(--dim); background: transparent; cursor: pointer;
    border: 1px solid color-mix(in srgb, var(--dim) 45%, transparent);
    border-radius: 4px; padding: 6px 12px; min-height: 36px;
  }
  #chips button:hover { color: var(--accent); border-color: var(--accent); }
  #chips button:focus-visible, #input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 520px) { body { padding: 10px; font-size: 15px; } #term { padding: 12px; } }
</style>
</head>
<body>
<div id="term">
  <div id="out" aria-live="polite"></div>
  <div class="row">
    <label class="prompt" id="prompt" for="input">user@start:~$</label>
    <input id="input" type="text" aria-label="command" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" enterkeyhint="go" autofocus>
  </div>
  <div id="suggestions" role="listbox" aria-label="Suggestions"></div>
  <div id="chips" aria-label="Shortcuts"></div>
</div>

<script>
  /* ---------- Config: edit defaults here (or use `config`, `add`, `theme` in the terminal) ---------- */
  const CONFIG = { newTab: true, fx: true, engine: "g", units: "c", theme: "green", chips: 6, historyMax: 100 };

  // "search" is optional: {q} is replaced by your query.
  const SITES = {
    gmail:     { url: "https://mail.google.com" },
    youtube:   { url: "https://www.youtube.com", search: "https://www.youtube.com/results?search_query={q}" },
    github:    { url: "https://github.com", search: "https://github.com/search?q={q}" },
    claude:    { url: "https://claude.ai" },
    chatgpt:   { url: "https://chatgpt.com" },
    reddit:    { url: "https://www.reddit.com", search: "https://www.reddit.com/search/?q={q}" },
    zombsroyale: { url: "https://zombsroyale.io" },
    wikipedia: { url: "https://www.wikipedia.org", search: "https://en.wikipedia.org/w/index.php?search={q}" },
    maps:      { url: "https://www.google.com/maps", search: "https://www.google.com/maps/search/{q}" },
    duolingo:  { url: "https://www.duolingo.com" },
    docs:      { url: "https://docs.google.com" }
  };

  const ENGINES = {
    g:     { name: "Google",     url: "https://www.google.com/search?q={q}" },
    ddg:   { name: "DuckDuckGo", url: "https://duckduckgo.com/?q={q}" },
    brave: { name: "Brave",      url: "https://search.brave.com/search?q={q}" },
    kagi:  { name: "Kagi",       url: "https://kagi.com/search?q={q}" },
    bing:  { name: "Bing",       url: "https://www.bing.com/search?q={q}" }
  };

  const THEMES = {   // [text, accent]
    green: ["#00ff66", "#8b5cf6"], amber: ["#ffb000", "#ff7a3d"],
    ice:   ["#7fe3ff", "#ff7ad9"], mono:  ["#e8e8e8", "#8b5cf6"]
  };

  /* ---------- State + storage ---------- */
  const store = {
    get(k, d) { try { const v = localStorage.getItem("sp:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("sp:" + k, JSON.stringify(v)); } catch {} }
  };
  const settings = Object.assign({}, CONFIG, store.get("cfg", {}));
  const custom = store.get("sites", {});
  const usage = store.get("use", {});
  const history = store.get("hist", []).slice(-settings.historyMax);
  const lists = { todo: store.get("todo", []), note: store.get("note", []) };
  const allSites = () => ({ ...SITES, ...custom });

  const out = document.getElementById("out");
  const input = document.getElementById("input");
  const box = document.getElementById("suggestions");
  const chips = document.getElementById("chips");
  const promptEl = document.getElementById("prompt");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let hIndex = history.length, suggestionIndex = -1, options = [];
  let pending = null, newTab = settings.newTab, skipBoot = false;

  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const saveCfg = () => store.set("cfg", settings);

  function applySettings() {
    const [fg, accent] = THEMES[settings.theme] || THEMES.green;
    document.documentElement.style.setProperty("--fg", fg);
    document.documentElement.style.setProperty("--accent", accent);
    document.documentElement.classList.toggle("fx", !!settings.fx);
  }

  /* ---------- Output ---------- */
  function print(text, cls) {
    const d = document.createElement("div");
    d.className = "line" + (cls ? " " + cls : "");
    d.textContent = text || "\u00a0";   // nbsp keeps blank lines from collapsing
    out.appendChild(d);
    return d;
  }

  async function typeLine(text, cls) {
    if (!settings.fx || reduceMotion || skipBoot) return print(text, cls);
    const d = print("", cls);
    d.textContent = "";
    for (const ch of text) {
      if (skipBoot) { d.textContent = text; return d; }
      d.textContent += ch;
      await sleep(9);
    }
    if (!text) d.textContent = "\u00a0";
    return d;
  }

  function printCommand(raw) {
    const d = document.createElement("div");
    d.className = "line";
    const p = document.createElement("span");
    p.className = "prompt"; p.textContent = "user@start:~$ ";
    const t = document.createElement("span");
    t.className = "typed"; t.textContent = raw;
    d.append(p, t);
    out.appendChild(d);
  }

  function go(url) {
    print("opening " + url + (newTab ? " in a new tab ..." : " ..."), "dim");
    if (newTab) window.open(url, "_blank", "noopener"); else location.href = url;
  }
  const searchWith = (tpl, q) => go(tpl.replace("{q}", encodeURIComponent(q)));
  const search = (q) => searchWith(ENGINES[settings.engine].url, q);

  function looksLikeUrl(s) {
    if (/\s/.test(s)) return false;
    if (/^https?:\/\//i.test(s)) return true;
    if (/^localhost(:\d+)?(\/.*)?$/i.test(s)) return true;
    return /^([a-z0-9-]+\.)+[a-z]{2,}(:\d+)?(\/.*)?$/i.test(s);
  }

  function distance(a, b) {
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    return d[a.length][b.length];
  }

  /* ---------- Commands ---------- */
  const lonelyParagraphs = [
    "Feeling lonely can make the world seem much farther away than it really is. But this feeling is not proof that you are unwanted or that things will always be this way. You matter, even on the quiet days when nobody seems to notice. Take one small step for yourself: get some water, open a window, listen to a song you love, or send a simple message to someone safe. You do not have to fix your whole life tonight.",
    "You are allowed to miss people and wish someone were beside you. That ache is part of being human; it does not mean there is something wrong with you. Try to be as gentle with yourself as you would be with a friend who felt this way. Make the next ten minutes a little kinder: get comfortable, breathe slowly, and choose one small thing that brings you peace. Small moments count, too.",
    "Loneliness tells convincing stories: that everyone else belongs somewhere, that you are falling behind, or that reaching out would be a bother. Those thoughts can feel real without being the whole truth. You do not need a perfect message or a big conversation to reconnect—something as simple as ‘Hey, how have you been?’ is enough to begin. And if nobody is available right now, this moment is still only a moment, not a verdict on your future.",
    "You do not have to earn care by being funny, useful, successful, or easy to be around. You deserve kindness simply because you are a person. If today feels heavy, lower the bar: eat something, wash your face, wrap yourself in a blanket, or step outside for a minute. Let that be enough for now. Connection can grow slowly, and you can take it one small step at a time.",
    "Sometimes the kindest thing to remember is that feelings change, even when they arrive saying they never will. You have made it through difficult hours before, and you only need to meet this one gently. If you can, reach toward someone you trust or spend a little time somewhere you feel safe around other people. You do not have to explain everything perfectly to deserve company."
  ];
  let lonelyIndex = -1;

  function listCmd(kind) {
    return (q) => {
      const L = lists[kind], m = q.match(/^(rm|done)\s+(\d+)$/i);
      if (m) {
        const i = +m[2] - 1;
        if (!L[i]) return print("No item " + m[2] + ".", "err");
        if (m[1].toLowerCase() === "rm") L.splice(i, 1); else L[i].done = !L[i].done;
        store.set(kind, L);
      } else if (q) { L.push({ t: q, done: false }); store.set(kind, L); }
      if (!L.length) return print("No " + kind + "s yet. Add one with: " + kind + " <text>", "dim");
      L.forEach((x, i) => print(" " + (i + 1) + ". [" + (x.done ? "x" : " ") + "] " + x.t, "dim"));
      print("Use '" + kind + " done <n>' or '" + kind + " rm <n>'.", "dim");
    };
  }

  function calc(expr) {
    expr = expr.trim();
    if (!expr) return print("Usage: = 12 * 7.5", "dim");
    if (!/^[\d\s+\-*\/%().^]+$/.test(expr)) return print("Calculator accepts numbers and + - * / % ^ ( ) only.", "err");
    try {
      const v = Function('"use strict"; return (' + expr.replace(/\^/g, "**") + ")")();
      print(Number.isFinite(v) ? String(+v.toPrecision(12)) : "Not a finite number.", Number.isFinite(v) ? "dim" : "err");
    } catch { print("Couldn't evaluate that.", "err"); }
  }

  function printHelp() {
    const L = (t) => print(t, "dim");
    L("Sites (add a query to search, e.g. youtube lofi):");
    for (const [n, s] of Object.entries(allSites())) L("  " + n.padEnd(12) + (s.search ? "searchable" : ""));
    L("");
    L("Search:  g | ddg | brave | kagi | bing <query>    or    !<engine or site> <query>");
    L("Ask AI:  /question opens Claude      ?question opens ChatGPT");
    L("Tools:   = 12*7.5    date    weather <city>    todo    note");
    L("Setup:   add <name> <url>    rm <name>    theme    config");
    L("Other:   news    clear (or Ctrl+L)    support");
    L("Flags:   end any command with -n (new tab) or -s (same tab).");
    L("Keys:    Tab completes. Up/Down browse suggestions or history.");
    L("");
    L("A URL opens directly. Anything else is searched with " + ENGINES[settings.engine].name + ".");
  }

  const COMMANDS = {
    help:   { hint: "show commands", fn: printHelp },
    clear:  { hint: "clear terminal", fn: () => { out.innerHTML = ""; } },
    cls:    { hint: "clear terminal", fn: () => { out.innerHTML = ""; } },
    news:   { hint: "top news stories", fn: () => go("https://news.google.com/topstories?hl=en-US&gl=US&ceid=US:en") },
    date:   { hint: "current date and time", fn: () => print(new Date().toLocaleString(undefined, { dateStyle: "full", timeStyle: "short" }), "dim") },
    todo:   { hint: "to-do list", fn: listCmd("todo") },
    note:   { hint: "quick notes", fn: listCmd("note") },
    lonely: { hint: "a little comfort", fn: () => {
      lonelyIndex = (lonelyIndex + 1) % lonelyParagraphs.length;
      print(lonelyParagraphs[lonelyIndex], "dim");
      print("Type lonely again for another reminder. If it ever feels heavier than this, talking to someone you trust or a support line can help; type support for options.", "dim");
    } },
    support: { hint: "find a helpline", fn: () => {
      print("You don't have to handle a hard time alone. findahelpline.com lists free support lines by country. If you might be in danger, call your local emergency number.", "dim");
      go("https://findahelpline.com");
    } },
    weather: { hint: "weather <city>", fn: async (q) => {
      if (!q) return print("Usage: weather <city>", "dim");
      const d = print("fetching weather ...", "dim");
      const f = settings.units === "f", u = f ? "°F" : "°C", sp = f ? " mph" : " km/h";
      const WMO = { 0: "Clear sky", 1: "Mostly clear", 2: "Partly cloudy", 3: "Overcast", 45: "Fog", 48: "Freezing fog",
        51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle", 56: "Freezing drizzle", 57: "Freezing drizzle",
        61: "Light rain", 63: "Rain", 65: "Heavy rain", 66: "Freezing rain", 67: "Freezing rain",
        71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow grains", 80: "Rain showers", 81: "Rain showers",
        82: "Violent showers", 85: "Snow showers", 86: "Heavy snow showers", 95: "Thunderstorm", 96: "Thunderstorm with hail", 99: "Thunderstorm with hail" };
      const getJSON = async (url) => {
        const c = new AbortController(), t = setTimeout(() => c.abort(), 10000);
        try {
          const r = await fetch(url, { signal: c.signal });
          if (!r.ok) throw new Error("HTTP " + r.status);
          const text = await r.text();
          try { return JSON.parse(text); } catch { throw new Error("reply was not JSON"); }
        } finally { clearTimeout(t); }
      };
      const n = Math.round;
      // Each provider returns the same shape: { place, desc, now, feels, hum, wind, min, max }
      const providers = [
        ["Open-Meteo", async () => {
          const g = await getJSON("https://geocoding-api.open-meteo.com/v1/search?count=1&name=" + encodeURIComponent(q));
          const p = g.results && g.results[0];
          if (!p) return null;
          const w = await getJSON("https://api.open-meteo.com/v1/forecast?latitude=" + p.latitude + "&longitude=" + p.longitude +
            "&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code" +
            "&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1" +
            (f ? "&temperature_unit=fahrenheit&wind_speed_unit=mph" : ""));
          const c = w.current;
          return { place: p.name + (p.country ? ", " + p.country : ""), desc: WMO[c.weather_code] || "Unknown conditions",
            now: c.temperature_2m, feels: c.apparent_temperature, hum: c.relative_humidity_2m, wind: c.wind_speed_10m,
            min: w.daily.temperature_2m_min[0], max: w.daily.temperature_2m_max[0] };
        }],
        ["wttr.in", async () => {
          const w = await getJSON("https://wttr.in/" + encodeURIComponent(q) + "?format=j1");
          const c = w.current_condition[0], day = w.weather[0], a = w.nearest_area && w.nearest_area[0];
          return { place: a ? a.areaName[0].value + ", " + a.country[0].value : q, desc: c.weatherDesc[0].value,
            now: f ? c.temp_F : c.temp_C, feels: f ? c.FeelsLikeF : c.FeelsLikeC, hum: c.humidity,
            wind: f ? c.windspeedMiles : c.windspeedKmph, min: f ? day.mintempF : day.mintempC, max: f ? day.maxtempF : day.maxtempC };
        }]
      ];
      const errors = [];
      for (const [name, load] of providers) {
        try {
          const r = await load();
          if (!r) { d.textContent = "Couldn't find a place called \"" + q + "\"."; d.classList.add("err"); return; }
          d.textContent = [r.place + ": " + r.desc,
            "  Now " + n(r.now) + u + " (feels like " + n(r.feels) + u + "), humidity " + r.hum + "%, wind " + n(r.wind) + sp,
            "  Today " + n(r.min) + u + " to " + n(r.max) + u].join("\n");
          return;
        } catch (e) { errors.push(name + ": " + (e.name === "AbortError" ? "timed out" : e.message)); }
      }
      d.textContent = "Couldn't load the weather.\n  " + errors.join("\n  ") +
        "\n  Check your connection, or whether an ad/privacy blocker is stopping requests to open-meteo.com and wttr.in.";
      d.classList.add("err");
    } },
    theme: { hint: "change colors", fn: (q) => {
      const t = q.toLowerCase();
      if (!THEMES[t]) return print("Themes: " + Object.keys(THEMES).join(", ") + "  (current: " + settings.theme + ")", "dim");
      settings.theme = t; saveCfg(); applySettings(); print("Theme set to " + t + ".", "dim");
    } },
    config: { hint: "settings", fn: (q) => {
      const [k, v] = q.toLowerCase().split(/\s+/);
      const on = v === "on" || v === "true";
      if (k === "newtab" && v) settings.newTab = on;
      else if (k === "fx" && v) settings.fx = on;
      else if (k === "engine" && ENGINES[v]) settings.engine = v;
      else if (k === "units" && (v === "c" || v === "f")) settings.units = v;
      else if (k) return print("Usage: config newtab on|off, config fx on|off, config units c|f, config engine " + Object.keys(ENGINES).join("|"), "err");
      saveCfg(); applySettings();
      print("newtab: " + (settings.newTab ? "on" : "off") + "   fx: " + (settings.fx ? "on" : "off") + "   engine: " + settings.engine + "   units: " + settings.units.toUpperCase(), "dim");
    } },
    add: { hint: "add <name> <url>", fn: (q) => {
      const [n, u] = q.split(/\s+/);
      if (!n || !u) return print("Usage: add <name> <url>   (put {q} in the url to make it searchable)", "dim");
      const name = n.toLowerCase();
      if (!/^[a-z0-9_-]+$/.test(name) || COMMANDS[name] || ENGINES[name]) return print("That name is reserved or invalid.", "err");
      let url = /^https?:\/\//i.test(u) ? u : "https://" + u, searchUrl;
      try {
        if (url.includes("{q}")) { searchUrl = url; url = new URL(url.replace("{q}", "x")).origin; } else url = new URL(url).href;
      } catch { return print("That URL isn't valid.", "err"); }
      custom[name] = searchUrl ? { url, search: searchUrl } : { url };
      store.set("sites", custom); renderChips();
      print("Saved " + name + " -> " + url, "dim");
    } },
    rm: { hint: "rm <name>", fn: (q) => {
      const n = q.toLowerCase();
      if (custom[n]) { delete custom[n]; store.set("sites", custom); renderChips(); print("Removed " + n + ".", "dim"); }
      else if (SITES[n]) print(n + " is built in. Edit SITES in the file, or override it with add.", "dim");
      else print("No bookmark named " + (n || "(none)") + ".", "err");
    } }
  };

  function bump(name) { usage[name] = (usage[name] || 0) + 1; store.set("use", usage); }

  function exec(cmd) {
    newTab = settings.newTab;
    cmd = cmd.replace(/\s+-([ns])$/i, (m, f) => { newTab = f.toLowerCase() === "n"; return ""; }).trim();
    const [first, ...rest] = cmd.split(/\s+/);
    const word = first.toLowerCase(), query = rest.join(" ");
    const sites = allSites();

    if (cmd[0] === "/") {
      const q = cmd.slice(1).trim();
      return q ? go("https://claude.ai/new?q=" + encodeURIComponent(q)) : print("Usage: /your question here", "dim");
    }
    if (cmd[0] === "?") {
      const q = cmd.slice(1).trim();
      return q ? go("https://chatgpt.com/?q=" + encodeURIComponent(q)) : printHelp();
    }
    if (cmd[0] === "=") return calc(cmd.slice(1));
    if (cmd[0] === "!") {
      const b = word.slice(1);
      const tpl = ENGINES[b] ? ENGINES[b].url : sites[b] && sites[b].search;
      if (!tpl) return print("Unknown bang. Try !g, !ddg, or !<site> for a searchable site.", "err");
      return query ? searchWith(tpl, query) : print("Usage: !" + b + " <query>", "dim");
    }
    if (word === "calc") return calc(query);
    if (COMMANDS[word]) { bump(word); return COMMANDS[word].fn(query); }
    if (ENGINES[word]) return query ? searchWith(ENGINES[word].url, query) : print("Usage: " + word + " <query>", "dim");
    if (sites[word]) {
      bump(word);
      const s = sites[word];
      return query && s.search ? searchWith(s.search, query) : go(s.url);
    }
    if (looksLikeUrl(cmd)) return go(/^https?:\/\//i.test(cmd) ? cmd : "https://" + cmd);

    if (!query && word.length >= 3) {   // typo forgiveness
      let best = null, bd = word.length <= 4 ? 2 : 3;
      for (const n of [...Object.keys(sites), ...Object.keys(COMMANDS)]) {
        const d = distance(word, n);
        if (d < bd) { bd = d; best = n; }
      }
      if (best) {
        pending = { fix: best, orig: cmd };
        return print('Did you mean "' + best + '"? (y/n)', "dim");
      }
    }
    search(cmd);
  }

  function run(raw) {
    printCommand(raw);
    const cmd = raw.trim();
    if (!cmd) return;
    if (pending) {
      const p = pending, a = cmd.toLowerCase();
      pending = null;
      if (a === "y" || a === "yes") return exec(p.fix);
      if (a === "n" || a === "no") return (newTab = settings.newTab, search(p.orig));
    }
    exec(cmd);
  }

  /* ---------- Suggestions ---------- */
  function score(name, q) {
    if (name.startsWith(q)) return 0;
    if (name.includes(q)) return 1;
    let i = 0;
    for (const c of name) if (c === q[i]) i++;
    return i === q.length ? 2 : -1;
  }

  function getSuggestions(value) {
    const q = value.trim().toLowerCase();
    if (!q) return [];
    const found = [], seen = new Set();
    const add = (v, hint, s) => { if (s >= 0 && !seen.has(v)) { seen.add(v); found.push({ value: v, hint, s, use: usage[v] || 0 }); } };
    for (const [n, s] of Object.entries(allSites())) add(n, s.search ? "open or search" : "open site", score(n, q));
    for (const [n, c] of Object.entries(COMMANDS)) add(n, c.hint, score(n, q));
    for (const n of Object.keys(ENGINES)) add(n, ENGINES[n].name + " search", score(n, q));
    for (let i = history.length - 1; i >= 0; i--) if (history[i].toLowerCase().startsWith(q)) add(history[i], "previous command", 3);
    found.sort((a, b) => a.s - b.s || b.use - a.use);
    return found.slice(0, 6);
  }

  function clearSuggestions() { box.innerHTML = ""; options = []; suggestionIndex = -1; }

  function renderSuggestions() {
    options = getSuggestions(input.value);
    box.innerHTML = ""; suggestionIndex = -1;
    options.forEach((o) => {
      const item = document.createElement("div");
      item.className = "suggestion"; item.setAttribute("role", "option");
      const v = document.createElement("strong"); v.textContent = o.value;
      const h = document.createElement("span"); h.className = "hint"; h.textContent = "  " + o.hint;
      item.append(v, h);
      item.addEventListener("mousedown", (e) => {
        e.preventDefault();
        input.value = o.value + (o.hint === "previous command" ? "" : " ");
        clearSuggestions(); input.focus();
      });
      box.appendChild(item);
    });
  }

  function moveSuggestion(dir) {
    const items = box.querySelectorAll(".suggestion");
    suggestionIndex = (suggestionIndex + dir + items.length) % items.length;
    items.forEach((el, i) => el.classList.toggle("active", i === suggestionIndex));
    input.value = options[suggestionIndex].value;
  }

  function complete() {
    const o = options[Math.max(suggestionIndex, 0)];
    input.value = o.value + (o.hint === "previous command" ? "" : " ");
    clearSuggestions();
  }

  function alignSuggestions() { box.style.marginLeft = (promptEl.offsetWidth + 8) + "px"; }

  function renderChips() {
    const names = Object.keys(allSites()).sort((a, b) => (usage[b] || 0) - (usage[a] || 0)).slice(0, settings.chips);
    chips.replaceChildren(...names.map((n) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = n;
      b.addEventListener("click", () => run(n));
      return b;
    }));
  }

  /* ---------- Events ---------- */
  input.addEventListener("keydown", (e) => {
    skipBoot = true;
    if (e.key === "Tab" && options.length) { e.preventDefault(); return complete(); }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const dir = e.key === "ArrowDown" ? 1 : -1;
      if (options.length) return moveSuggestion(dir);
      if (dir < 0) { if (hIndex > 0) input.value = history[--hIndex]; }
      else { hIndex = Math.min(hIndex + 1, history.length); input.value = history[hIndex] || ""; }
      return;
    }
    if (e.key === "Escape") return clearSuggestions();
    if (e.key === "Enter") {
      const v = input.value;
      clearSuggestions();
      if (v.trim() && history[history.length - 1] !== v) {
        history.push(v);
        if (history.length > settings.historyMax) history.shift();
        store.set("hist", history);
      }
      hIndex = history.length;
      input.value = "";
      run(v);
      window.scrollTo(0, document.body.scrollHeight);
    }
  });

  input.addEventListener("input", renderSuggestions);

  // Ctrl+L clears the terminal, like a real shell.
  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey && e.key.toLowerCase() === "l") {
      e.preventDefault(); out.innerHTML = ""; input.value = ""; clearSuggestions(); input.focus();
    }
  });

  // Clicking focuses the prompt, unless you are selecting text or tapping a shortcut.
  document.addEventListener("click", (e) => {
    if (String(getSelection()).length || e.target.closest("#chips")) return;
    input.focus();
  });
  window.addEventListener("pageshow", () => { input.value = ""; input.focus(); });
  window.addEventListener("resize", alignSuggestions);

  /* ---------- Boot ---------- */
  applySettings();
  renderChips();
  alignSuggestions();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(alignSuggestions);
  input.focus();
  (async () => {
    await typeLine(new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" }));
    await typeLine("Welcome. Type a keyword, a URL, or anything to search " + ENGINES[settings.engine].name + ".");
    await typeLine("Type 'help' to see all commands.", "dim");
    print("");
  })();
</script>
</body>
</html>
