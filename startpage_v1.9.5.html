<body>
<div id="term">
  <div id="out"></div>
  <div class="row">
    <span class="prompt">user@start:~$</span>
    <input id="input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
  </div>
</div>

<script>
  // Add or change sites here. "search" is optional: {q} is replaced by your query.
  const SITES = {
    gmail:     { url: "https://mail.google.com" },
    youtube:   { url: "https://www.youtube.com", search: "https://www.youtube.com/results?search_query={q}" },
    github:    { url: "https://github.com", search: "https://github.com/search?q={q}" },
    claude:    { url: "https://claude.ai" },
    chatgpt:   { url: "https://chatgpt.com" },
    reddit:    { url: "https://www.reddit.com", search: "https://www.reddit.com/search/?q={q}" },
    zombsroyale: { url: "https://zombsroyale.io" },
    wikipedia: { url: "https://www.wikipedia.org", search: "https://en.wikipedia.org/w/index.php?search={q}" },
    maps:      { url: "https://www.google.com/maps", search: "https://www.google.com/maps/search/{q}" },
    duolingo:  { url: "https://www.duolingo.com" },
    docs:      { url: "https://docs.google.com" }
  };

  const out = document.getElementById("out");
  const input = document.getElementById("input");
  const history = [];
  let hIndex = 0;

  function print(text, cls) {
    const d = document.createElement("div");
    d.className = "line" + (cls ? " " + cls : "");
    d.textContent = text;
    out.appendChild(d);
    return d;
  }

  function printCommand(raw) {
    const d = document.createElement("div");
    d.className = "line";
    const prompt = document.createElement("span");
    prompt.className = "prompt";
    prompt.textContent = "user@start:~$ ";
    const typed = document.createElement("span");
    typed.className = "typed";
    typed.textContent = raw;
    d.append(prompt, typed);
    out.appendChild(d);
    return d;
  }

  function printHelp() {
    print("Keywords:", "dim");
    for (const [name, s] of Object.entries(SITES)) {
      const hint = s.search ? "  (add a query to search, e.g. " + name + " lofi)" : "";
      const d = print("  " + name.padEnd(10) + hint, "dim");
    }
    print("", "dim");
    print("  help       show this list", "dim");
    print("  clear      clear the screen", "dim");
    print("", "dim");
    print("Start a line with / to ask Claude, e.g. /why is the sky blue", "dim");
    print("It opens claude.ai in a new tab with your question.", "dim");
    print("Start a line with ? to ask ChatGPT, e.g. ?why is the sky blue", "dim");
    print("", "dim");
    print("Anything that looks like a URL opens it directly.", "dim");
    print("Anything else is searched on Google.", "dim");
  }

  function looksLikeUrl(s) {
    if (/\s/.test(s)) return false;
    if (/^https?:\/\//i.test(s)) return true;
    if (/^localhost(:\d+)?(\/.*)?$/i.test(s)) return true;
    return /^([a-z0-9-]+\.)+[a-z]{2,}(:\d+)?(\/.*)?$/i.test(s);
  }

  function go(url) {
    print("opening " + url + " in a new tab ...", "dim");
    window.open(url, "_blank", "noopener");
  }

  function run(raw) {
    const cmd = raw.trim();
    const [first, ...rest] = cmd.split(/\s+/);
    const word = first.toLowerCase();
    const query = rest.join(" ");
    printCommand(raw);
    if (!cmd) return;

    if (cmd.startsWith("/")) {
      const q = cmd.slice(1).trim();
      if (!q) return print("Usage: /your question here", "dim");
      return go("https://claude.ai/new?q=" + encodeURIComponent(q));
    }

    if (cmd.startsWith("?")) {
      const q = cmd.slice(1).trim();
      if (!q) return printHelp();
      return go("https://chatgpt.com/?q=" + encodeURIComponent(q));
    }

    if (word === "help") return printHelp();
    if (word === "clear" || word === "cls") { out.innerHTML = ""; return; }

    if (SITES[word]) {
      const s = SITES[word];
      if (query && s.search) return go(s.search.replace("{q}", encodeURIComponent(query)));
      return go(s.url);
    }

    if (looksLikeUrl(cmd)) {
      return go(/^https?:\/\//i.test(cmd) ? cmd : "https://" + cmd);
    }

    go("https://www.google.com/search?q=" + encodeURIComponent(cmd));
  }

  input.addEventListener("keydown", (e) => {
    // Tab opens current top news stories instead of moving focus away from the prompt.
    if (e.key === "Tab") {
      e.preventDefault();
      return go("https://news.google.com/topstories?hl=en-US&gl=US&ceid=US:en");
    }

    if (e.key === "Enter") {
      const v = input.value;
      if (v.trim()) { history.push(v); hIndex = history.length; }
      input.value = "";
      run(v);
      window.scrollTo(0, document.body.scrollHeight);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      if (hIndex > 0) input.value = history[--hIndex];
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      hIndex = Math.min(hIndex + 1, history.length);
      input.value = history[hIndex] || "";
    }
  });

  // Right Shift clears the visible terminal/chat output.
  document.addEventListener("keydown", (e) => {
    if (e.code === "ShiftRight") {
      e.preventDefault();
      out.innerHTML = "";
      input.value = "";
      input.focus();
    }
  });

  // Clicking anywhere focuses the prompt; restore focus when returning via back button.
  document.addEventListener("click", () => input.focus());
  window.addEventListener("pageshow", () => { input.value = ""; input.focus(); });

  print("Welcome. Type a keyword, a URL, or anything to search Google.");
  print("Type 'help' to see all keywords.", "dim");
  print("");
  input.focus();
</script>
</body>
</html>
